[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-hedge-fund"
version = "1.3.0"
description = "Dinesh AI Fund — 7-agent investment research floor founded by Dineshgopi Sunkara"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Dineshgopi Sunkara"}]
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-anthropic>=0.2.0",
    "langchain-core>=0.3.0",
    "yfinance>=0.2.40",
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.21.0"]
dev = ["pytest>=8.0.0", "pillow>=10.0.0", "httpx>=0.27.0"]

[project.scripts]
hedge-fund = "hedge_fund.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hedge_fund = ["web/static/*", "web/static/assets/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
